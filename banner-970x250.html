<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hallo Hi Banner</title>
    <link rel="stylesheet" href="banner-970x250.css">
</head>

<body>
    <main class="banner">
        <section class="left" aria-label="Abonnement">
            <div class="accent-bars" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="headline">
                <h1>Hallo,</h1>
                <span class="hi-logo" aria-label="Hi">Hi</span>
            </div>
            <h2>Internet + Bellen.</h2>
            <p class="small">Sim Only abonnement</p>
        </section>

        <section class="middle" aria-label="Abonnementsdetails">
            <img class="sim-card" src="simKaart.png" alt="Simkaart">
            <ul class="details">
                <li>+ Onbeperkt data</li>
                <li>+ 39,95/mnd</li>
                <li>+ Snelheid tot 1Gbit/s</li>
            </ul>
        </section>

        <button class="cta" type="button">Ontdek<br>meer</button>
    </main>
</body>

</html>
